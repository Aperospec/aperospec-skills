display_name: Aperospec Injection
short_description: Existing content injection engine.
default_prompt: Use Aperospec Injection to analyze existing user content, detect which Aperospec Pipeline layer it belongs to, confirm formal names for Existing Assets, lock confirmed names in Lock Asset State, decide which layers should be locked, skipped, assisted, injected, or continued, and output a Runtime Injection Map (RIM). When the user provides reference images, classify them as Content Reference, Style Reference Only, or Brand / Asset Lock before routing them. If the user wants only style, brushwork, texture, material feeling, color, lighting, rendering method, or says not to use image elements, convert the reference images into a Style DNA Map for the Visual Direction Layer only; do not preserve or reuse depicted subjects, objects, characters, logos, scenes, layouts, poses, or narrative events. Unless the user explicitly requests renaming, downstream Skills must not rename, summarize, stylize, or AI-optimize confirmed asset names. Do not create worldview, narrative, concept deck, or visual design.
