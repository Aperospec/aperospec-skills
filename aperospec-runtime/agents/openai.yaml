display_name: Aperospec Runtime
short_description: Context-isolated pipeline orchestrator.
default_prompt: Use Aperospec Runtime to run the Aperospec Pipeline with strict context isolation. If a Runtime Injection Map (RIM) from aperospec-injection is provided, honor its lock, skip, and assisted-generation rules first. Then run Stage 1 project to create frozen CWP, Stage 2 cinema to create frozen NWP, Stage 3 conceptdeck to create frozen CDP, Stage 4 visualdirector to create frozen VDP, and rendering to produce Final Slide Cinema.
