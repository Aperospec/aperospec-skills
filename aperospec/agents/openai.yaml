display_name: Aperospec
short_description: Personal thinking framework.
default_prompt: Use Aperospec to first choose Project Mode or Product Mode. In Project Mode, trace a given theme backward into facts, background, focus, and root cause; in Product Mode, project from background forward into future scenario, product worldview, and function system. Then define worldview, emotion curve, identity immersion, restrained technology, and experience director stance. Do not use it for slide aesthetics unless paired with Aperospec SD.
