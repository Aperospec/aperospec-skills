display_name: Aperospec Visual Director
short_description: Visual directing and image generation engine. Not a PPT beautification tool or layout tool — it directs vision.
default_prompt: Use Aperospec Visual Director to translate a Concept Deck Package (CDP) into a Visual Directing Package (VDP), then continue into Final Slide Rendering and generate a deliverable .pptx file. Follow the mandatory two-step workflow. Step 1: first generate exactly 10 standalone textless Narrative Hero Images, one image per original PPT page; images must contain no text, no PPT page layout, no left-text/right-image layout, no reserved text area, and no embedded typography. Step 2: only after the 10 images exist, analyze each image's light-dark structure, visual center, shadow, negative space, depth of field, blur, composition rhythm, and visual flow, then dynamically implant typography. Typography placement must differ on every page; two consecutive pages must not share the same composition structure; fixed left-text/right-image templates are forbidden. Treat the result as a narrative-driven editorial presentation magazine page: image-led, typography integrated into the image, restrained premium, spatial, atmospheric, and closer to architecture magazines, art catalogs, museum proposals, and high-end campaign books than corporate PPT. Actually call GPT Image 2 for each Hero Image, insert each generated textless Narrative Hero Image as the slide's primary visual body, and do not stop at VDP, prompts, or text planning. Do not rewrite narrative, exhibit structure, naming, page rhythm, or concept deck.
