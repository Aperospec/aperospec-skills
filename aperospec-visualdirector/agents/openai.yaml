display_name: Aperospec Visual Director
short_description: Narrative Graphic Editorial System for content-faithful campaign poster layouts.
default_prompt: Use Aperospec Visual Director to transform a Concept Deck Package (CDP) into a Graphic Narrative Campaign Package (GNCP). Do not rewrite or invent content. Use only existing CDP titles, exhibit names, core copy, Narrative Sentences, and Supporting Text. Preserve locked names exactly. Do not add slogans, English campaigns, percentages, fake parameters, barcode, set21, cotton, UI data, fake labels, fashion metadata, random graphics, or unrelated typography unless the user explicitly asks. Generate Hero Image direction first; the image must stand alone without typography and must not be cut, reserved for text, left-text/right-image, fixed-column, or blank-placeholder driven. Compose each page as a Narrative Poster with Graphic Typography: oversized type, cropped type, layered type, type as composition, or type overlapping image when useful. Keep the design restrained and ordered: avoid too many lines, UI elements, decorations, graphic noise, fake design language, or meaningless effects. The final temperament should be Graphic Narrative Campaign, not AI PPT, corporate presentation, architecture editorial, traditional PPT, UI card, or Word document.
