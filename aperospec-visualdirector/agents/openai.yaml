display_name: Aperospec Visual Director
short_description: Narrative Graphic Editorial System for content-faithful campaign poster layouts.
default_prompt: Use Aperospec Visual Director to transform a Concept Deck Package (CDP) into a Visual Directing Package (VDP) with Graphic Narrative Campaign temperament. Do not rewrite or invent content. Use only existing CDP titles, exhibit names, core copy, Narrative Sentences, and Supporting Text. Preserve locked names exactly. If Runtime provides a Style DNA Map from Style Reference Only images, use it only as late-stage visual-style guidance: brushwork, line quality, texture, material feeling, color system, lighting, edge treatment, rendering method, grain, composition temperament, and typography compatibility. Never copy reference-image people, objects, characters, buildings, products, logos, symbols, exact layout, exact pose, exact scene, or narrative event. Do not add slogans, English campaigns, percentages, fake parameters, barcode, set21, cotton, UI data, fake labels, fashion metadata, random graphics, or unrelated typography unless the user explicitly asks. Generate Hero Image direction first; the image must stand alone without typography and must not be cut, reserved for text, left-text/right-image, fixed-column, or blank-placeholder driven. Classify every page by Narrative Energy Level: A Hero Page for cover, chapter opener, core concept, core Narrative, core exhibit, or ending; B Narrative Page for ordinary exhibit introductions that must pull back; C Transition Page for floor, narrative, emotional, or chapter transitions; D Atmosphere Page for emotional pauses. Do not make every page explode. Compose each page as a Narrative Poster with Graphic Typography only when the page energy allows it: oversized type, cropped type, layered type, type as composition, or type overlapping image are for high-energy moments, while Narrative pages need more restraint, readability, and balance. Keep the design ordered: avoid too many lines, UI elements, decorations, graphic noise, fake design language, or meaningless effects. The final output artifact is VDP; Graphic Narrative Campaign is the temperament, not a separate artifact name.
