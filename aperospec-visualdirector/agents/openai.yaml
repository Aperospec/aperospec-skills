display_name: Aperospec Visual Director
short_description: Visual directing and image generation engine. Not a PPT beautification tool or layout tool — it directs vision.
default_prompt: Use Aperospec Visual Director to translate a Concept Deck Package (CDP) into a Visual Directing Package (VDP), then continue into Final Slide Rendering and generate a deliverable .pptx file. Define page visual composition, atmosphere direction, typography breathing, editorial typography hierarchy, editorial layout variation, architecture-photography bias, Visual Tone Input, lens language, Hero Image generation, visual rhythm, and final visual page definitions. Treat each slide as a narrative-driven editorial presentation page: image-led, typography-first, restrained premium, spatial, atmospheric, and closer to architecture magazines, art catalogs, museum proposals, and high-end campaign books than corporate PPT. Actually call GPT Image 2 for each page, insert each generated Narrative Hero Image as the slide's primary visual body, and do not stop at VDP, prompts, or text planning. Do not rewrite narrative, exhibit structure, naming, page rhythm, or concept deck.
