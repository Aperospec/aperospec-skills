display_name: Aperospec Visual Director
short_description: Cinematic visual directing engine.
default_prompt: Use Aperospec Visual Director to turn a Storyboard Package (SBP) into a Visual Directing Package (VDP). Define slide composition, typography direction, image direction, visual rhythm, cinematic prompts, and rendering notes. Treat each slide as a film shot, make every page image-led, and do not rewrite narrative or storyboard.
