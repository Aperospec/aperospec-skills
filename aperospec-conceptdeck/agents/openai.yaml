display_name: Aperospec Concept Deck
short_description: NWP to CDP concept narrative engine.
default_prompt: Use Aperospec Concept Deck to translate a Narrative World Package (NWP) into a Concept Deck Package (CDP): concept sequence, emotional curve, cognitive triggers, atmosphere directions, narrative rhythm, typography density, silence/breathing structure, director rhythm, page-density variation, layout variation, narrative weight, information density control, concept unit integrity, and page splitting logic. Do not over-split complete concepts into emotional fragment pages. Do not design visuals, create image prompts, or make final slide layouts.
