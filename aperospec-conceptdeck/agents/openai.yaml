display_name: Aperospec Concept Deck
short_description: NWP to CDP concept narrative engine.
default_prompt: Use Aperospec Concept Deck to translate a Narrative World Package (NWP) into a Concept Deck Package (CDP): concept sequence, emotional curve, cognitive triggers, atmosphere directions, narrative rhythm, typography density, silence/breathing structure, director rhythm, exhibition proposal narrative, exhibit-item explanation logic, page-density variation, layout variation, narrative weight, information density control, concept unit integrity, and page splitting logic. Preserve exhibition proposal logic: every page must advance Narrative, express information, explain exhibit-item purpose, carry educational meaning, atmosphere, and concept direction. Do not over-split complete concepts into emotional fragment pages. Do not design visuals, create image prompts, or make final slide layouts.
