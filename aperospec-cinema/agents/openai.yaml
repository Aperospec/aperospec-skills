display_name: Aperospec Cinema
short_description: CWP to NWP translation API.
default_prompt: Use Aperospec Cinema to translate a Cognitive World Package (CWP) from aperospec-project into a fixed Narrative World Package (NWP) for aperospec-conceptdeck. Map CWP fields into narrative world, emotional environment, Something Is Coming, core conflict, emotional curve, immersive experience, visual world, and scene potentials. Do not re-analyze the world or create slides.
